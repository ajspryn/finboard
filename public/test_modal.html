<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf-token" content="test-csrf-token" />
    <title>Test Modal</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container mt-5">
      <h1>Test Search Detail Modal</h1>
      <button onclick="testModal()" class="btn btn-primary">Test Modal</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      async function testModal() {
        console.log('Testing modal...');

        try {
          const response = await fetch('http://127.0.0.1:8001/api/search/deposito/1', {
            method: 'GET',
            headers: {
              'X-Requested-With': 'XMLHttpRequest',
              Accept: 'application/json',
              'X-CSRF-TOKEN': 'test-csrf-token',
            },
          });

          console.log('Response status:', response.status);

          if (response.ok) {
            const data = await response.json();
            console.log('Response data:', data);

            if (data.success) {
              showDetailModal('deposito', data.data);
            } else {
              alert('API Error: ' + (data.message || 'Unknown error'));
            }
          } else {
            alert('HTTP Error: ' + response.status);
          }
        } catch (error) {
          console.error('Fetch error:', error);
          alert('Network Error: ' + error.message);
        }
      }

      function showDetailModal(type, data) {
        console.log('showDetailModal called with type:', type, 'data:', data);

        const typeTitle = 'Deposito';
        const typeIcon = 'ti-piggy-bank';
        const typeColor = 'success';

        let detailHtml = `
                <div class="row g-3">
                    <div class="col-md-6">
                        <div class="card border-info">
                            <div class="card-header bg-info text-white">
                                <h6 class="mb-0"><i class="ti ti-piggy-bank me-2"></i>Informasi Deposito</h6>
                            </div>
                            <div class="card-body">
                                <table class="table table-sm table-borderless">
                                    <tr><td class="fw-bold">Nomor Deposito:</td><td><strong class="text-info">${data.nodep || '-'}</strong></td></tr>
                                    <tr><td class="fw-bold">Nama Nasabah:</td><td>${data.nama || '-'}</td></tr>
                                    <tr><td class="fw-bold">Alamat:</td><td>${data.alamat || '-'}</td></tr>
                                    <tr><td class="fw-bold">No. HP:</td><td>${data.hp || '-'}</td></tr>
                                </table>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card border-success">
                            <div class="card-header bg-success text-white">
                                <h6 class="mb-0"><i class="ti ti-trending-up me-2"></i>Informasi Finansial</h6>
                            </div>
                            <div class="card-body">
                                <table class="table table-sm table-borderless">
                                    <tr><td class="fw-bold">Nominal Deposito:</td><td class="text-end"><strong class="text-success">Rp ${Number(data.nomrp || 0).toLocaleString('id-ID')}</strong></td></tr>
                                    <tr><td class="fw-bold">Suku Bunga:</td><td class="text-end">${data.equivrate || 0}% p.a</td></tr>
                                    <tr><td class="fw-bold">Status:</td><td><span class="badge bg-success">Aktif</span></td></tr>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            `;

        const modalHtml = `
                <div class="modal fade" id="testDetailModal" tabindex="-1">
                    <div class="modal-dialog modal-lg">
                        <div class="modal-content">
                            <div class="modal-header bg-${typeColor} text-white">
                                <h5 class="modal-title">
                                    <i class="${typeIcon} me-2"></i>
                                    Detail ${typeTitle}
                                </h5>
                                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                ${detailHtml}
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;

        // Remove existing modal if any
        const existingModal = document.getElementById('testDetailModal');
        if (existingModal) {
          existingModal.remove();
        }

        // Add modal to body
        document.body.insertAdjacentHTML('beforeend', modalHtml);

        // Show modal
        const modalElement = document.getElementById('testDetailModal');
        if (modalElement) {
          const modal = new bootstrap.Modal(modalElement);
          modal.show();

          // Clean up modal when hidden
          modalElement.addEventListener('hidden.bs.modal', function () {
            this.remove();
          });
        }
      }
    </script>
  </body>
</html>
